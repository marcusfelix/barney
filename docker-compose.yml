services:
  barney:
    build: .
    image: barney:v0
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Everything in .env (including agent API keys) is injected into the
    # container environment and inherited by the opencode process — the
    # container stays stateless across upgrades.
    env_file:
      - .env
    environment:
      PORT: "8080"
      WORKSPACE_ROOT: /var/lib/barney/workspaces
    volumes:
      - barney-workspaces:/var/lib/barney/workspaces
      # Docker-in-Docker via the host daemon: lets agents build and run
      # containers (toolchains, verification) without bloating the image.
      # Tradeoff: the agent effectively has root-level access to the host
      # Docker daemon — mount only on trusted, single-purpose hosts.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  barney-workspaces:
